<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no painel | Flow Market</title>

    <!-- Fonte externa: Poppins. Precisa de internet para carregar do Google Fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style-login.css">
</head>

<body>
    <!--
        DESCOBERTA: a página é formada por caixas dentro de caixas.
        Section agrupa partes relacionadas da página. Aqui, .imagens contém a logo.
    -->
    <section class="imagens">
        <img src="../img/carrinho.png" alt="Carrinho de compras" class="logoCarrinho">
        <img src="../img/Flowmarket.png" alt="Flow Market" class="logoNome">
    </section>

    <!-- Fundo que ocupa a área principal da tela -->
    <section class="backDosGraunds">
        <form action="" novalidate onsubmit="validarLogin(event)">
            <!-- Cartão branco que contém todo o formulário -->
            <section class="containerPrincipal">
                <section class="formatacao">
                    <section class="textoFormulario">
                        <section class="titulo">
                            <h3>Entrar no Painel</h3>
                        </section>

                        <p class="descricao">Use o e-mail e a senha cadastrados na sua conta.</p>
                        <p id="mensagem_login" class="mensagemLogin" role="alert" aria-live="polite" hidden></p>

                        <!-- label identifica o campo; o for deve combinar com o id do input -->
                        <label for="ipt_email">E-mail corporativo</label>
                        <input type="email" id="ipt_email" placeholder="fernanda@lojacorporativa.com" required>

                        <section class="linhaSenha">
                            <label for="ipt_password">Senha</label>
                            <a href="#" class="esqueciSenha">Esqueci a senha</a>
                        </section>
                        <section class="campoSenha">
                            <input type="password" id="ipt_password" placeholder="Mínimo de 6 caracteres" required>
                            <!-- Ícone ilustrativo em texto; não revela/esconde a senha ainda. -->
                            <span class="iconeOlho" aria-hidden="true">◉</span>
                        </section>
                    </section>

                    <!--
                        DESCOBERTA: Flexbox organiza os elementos filhos.
                        O botão fica abaixo dos campos porque .formatacao usa flex-direction: column.
                    -->
                    <button type="submit" class="containerSecundarioVerde">Entrar</button>
                </section>
            </section>
        </form>

        <!-- Fica abaixo do cartão, como na referência -->
        <p class="cadastro">Ainda não tem uma conta? <a href="../pages/cadastro.html">Cadastre sua loja</a></p>
    </section>

    <script>
        function validarLogin(event) {
            event.preventDefault();

            let email = ipt_email.value.trim();
            let senha = ipt_password.value;
            let mensagem = document.getElementById('mensagem_login');

            sessionStorage.removeItem('usuario_autenticado');

            if (email == '' || senha == '') {
                mensagem.textContent = 'Preencha o e-mail e a senha antes de continuar.';
                mensagem.hidden = false;
                return;
            }

            let usuarioSalvo = localStorage.getItem('dados_cadastro');

            if (usuarioSalvo == null) {
                mensagem.textContent = 'Não encontramos uma conta cadastrada. Cadastre sua loja antes de entrar.';
                mensagem.hidden = false;
                return;
            }

            let dadosCadastro;

            try {
                dadosCadastro = JSON.parse(usuarioSalvo);
            } catch (erro) {
                mensagem.textContent = 'Não foi possível ler os dados da conta cadastrada.';
                mensagem.hidden = false;
                return;
            }

            if (dadosCadastro != null &&
                typeof dadosCadastro.email == 'string' &&
                typeof dadosCadastro.senha == 'string' &&
                dadosCadastro.email.toLowerCase() == email.toLowerCase() &&
                dadosCadastro.senha == senha
            ) {
                sessionStorage.setItem('usuario_autenticado', 'true');
                window.location.href = 'dashboard.html';
            } else {
                mensagem.textContent = 'E-mail ou senha inválidos.';
                mensagem.hidden = false;
            }
        }
    </script>
</body>
</html>
