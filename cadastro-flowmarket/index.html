<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Cadastro</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <h1 class="title">Flow<span style="color: #6AAE48">market</span></h1>
    </div>

    <form action="/cadastrar-usuario" class="cad-container">

        <div class="form-header">
            <h1 class="title">Criar Conta</h1>

            <p class="form-text">Cadastro com dados da empresa, leva menos de um minuto.</p>
        </div>

        <div class="campo">
            <label for="ipt_nome">Nome Completo:</label>
            <input type="text" id="ipt_nome" class="form-input">
        </div>

        <div class="campo">
            <label for="ipt_email">E-mail Corporativo:</label>
            <input type="email" id="ipt_email" class="form-input">
        </div>

        <div class="campo">
            <label for="ipt_senha">Senha:</label>
            <input type="password" id="ipt_senha" class="form-input">
        </div>

        <div class="campo">
            <label for="ipt_conf_senha">Confirmar senha:</label>
            <input type="password" id="ipt_conf_senha" class="form-input">
        </div>

        <div class="campo">
            <label for="ipt_razao">Razão Social da empresa:</label>
            <input type="text" id="ipt_razao" class="form-input">
        </div>

        <div class="campo">
            <label for="ipt_cnpj">CNPJ:</label>
            <input type="text" id="ipt_cnpj" class="form-input">
        </div>


        <div class="campo">
            <label>Porte da loja</label>

            <div class="opcoes-porte">

                <label for="porte_grande">
                    <input type="radio" id="porte_grande" name="porte" value="grande">
                    Grande Porte
                </label>


                <label for="porte_medio">
                    <input type="radio" id="porte_medio" name="porte" value="medio">
                    Médio Porte
                </label>


                <label for="porte_pequeno">
                    <input type="radio" id="porte_pequeno" name="porte" value="pequeno">
                    Pequeno Porte
                </label>
            </div>
        </div>

        <div class="campo">
            <label for="ipt_telefone">Telefone:</label>
            <input type="tel" id="ipt_telefone" class="form-input">
        </div>

        <div>
            <button type="submit" class="button-cadastro">Cadastrar</button>
        </div>

        <div>
            <p class="form-text">
                Ao criar a conta, você concorda com os Termos de Uso e com o tratamento de dados previsto na LGPD.
            </p>
        </div>

    </form>
</body>

</html>
